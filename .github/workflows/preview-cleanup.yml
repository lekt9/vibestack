# A branch that is gone takes its preview deployment with it.
name: preview-cleanup
on:
  delete:
  pull_request:
    types: [closed]
permissions:
  contents: read
jobs:
  remove:
    if: github.event_name == 'pull_request' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    steps:
      - uses: actions/checkout@v4
      # A repo's own setup action stands in for Node 22 + npm (vibestack's: Node 26, pnpm, Dafny 4.11, Chromium).
      - if: hashFiles('.github/actions/setup/action.yml') != ''
        uses: ./.github/actions/setup
      - if: hashFiles('.github/actions/setup/action.yml') == ''
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: "[ -x node_modules/.bin/wrangler ] || npm ci --ignore-scripts || npm i --no-save wrangler"
      - run: node .deploy/deploy.mjs preview --branch "$BRANCH" --delete
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.event.ref }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
